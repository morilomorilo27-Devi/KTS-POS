services:
  kts-pos:
    build: .
    container_name: kts_pos_app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - HOST=0.0.0.0
      - KTS_DB_PATH=/app/database/kts_pos.db
      - KTS_BACKUP_DIR=/app/database/backups
      # Optionally override secret keys
      # - KTS_BACKUP_KEY=your_secure_32_byte_hex_key_here
      # - KTS_SALT=kts_pos_fixed_salt_2026
    volumes:
      - ./database:/app/database
      - ./client/images/uploads:/app/client/images/uploads

